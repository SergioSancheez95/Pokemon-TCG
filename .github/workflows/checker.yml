name: Check Pokemon Stock

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: |
          pip install requests beautifulsoup4

      - name: Ejecutar rastreador
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py

      - name: Guardar estado de productos
        run: |
          git config --global user.name "Stock Bot"
          git config --global user.email "bot@github.com"
          git add seen_products.json || true
          git commit -m "Auto: Actualizar historial de stock" || true
          git push || true
